name: SWA — Clean preview environments

# The dev Static Web App (Free tier) allows only 3 staging environments and
# web-deploy.yml creates one per PR, so orphaned previews eventually exhaust
# the quota and every PR deploy fails with "maximum number of staging
# environments". This workflow deletes all staging environments except the
# ones listed in `keep` (typically the PRs still open).
on:
  workflow_dispatch:
    inputs:
      keep:
        description: "Comma-separated environment names to keep (PR numbers, e.g. 47,46)"
        required: false
        default: "47"

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-bumeet-dev
  SWA_NAME: swa-bumeet-dev

jobs:
  cleanup:
    name: Delete orphaned preview environments
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Delete staging environments not in keep list
        run: |
          KEEP=",${{ github.event.inputs.keep }},"
          echo "── Environments before cleanup ──"
          az staticwebapp environment list \
            --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "[].{name:name, hostname:hostname, status:status}" -o table

          for ENV_NAME in $(az staticwebapp environment list \
              --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" \
              --query "[?name!='default'].name" -o tsv); do
            if [[ "$KEEP" == *",$ENV_NAME,"* ]]; then
              echo "⏭  Keeping '$ENV_NAME' (in keep list)"
              continue
            fi
            echo "🗑  Deleting staging environment '$ENV_NAME'"
            az staticwebapp environment delete \
              --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" \
              --environment-name "$ENV_NAME" --yes
          done

          echo "── Environments after cleanup ──"
          az staticwebapp environment list \
            --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "[].{name:name, hostname:hostname, status:status}" -o table

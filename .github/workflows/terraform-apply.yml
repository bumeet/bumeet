name: "Terraform Apply"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply (dev or prod)"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VERSION:          "1.8.5"
  ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}

jobs:
  apply-dev:
    name: "Apply — dev"
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infra/envs/dev

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      # TEMPORARY (branch-only): import pre-existing drifted resources that were
      # created outside of (or lost from) the Terraform state, so the apply can
      # proceed instead of failing with "already exists".
      - name: Import drifted resources (idempotent)
        env:
          SUB: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          if ! terraform state list | grep -q 'module.bumeet.module.releases_storage.azurerm_storage_account.this'; then
            terraform import -lock-timeout=5m \
              -var="pg_admin_password=${{ secrets.PG_ADMIN_PASSWORD_DEV }}" \
              'module.bumeet.module.releases_storage.azurerm_storage_account.this' \
              "/subscriptions/${SUB}/resourceGroups/rg-bumeet-dev/providers/Microsoft.Storage/storageAccounts/stbumeetreleases"
          fi
          if ! terraform state list | grep -q 'module.bumeet.module.releases_storage.azurerm_storage_container.releases'; then
            terraform import -lock-timeout=5m \
              -var="pg_admin_password=${{ secrets.PG_ADMIN_PASSWORD_DEV }}" \
              'module.bumeet.module.releases_storage.azurerm_storage_container.releases' \
              "https://stbumeetreleases.blob.core.windows.net/releases" || echo "container not found in Azure — apply will create it"
          fi

      - name: Terraform Apply
        run: |
          terraform apply \
            -lock-timeout=5m \
            -var="pg_admin_password=${{ secrets.PG_ADMIN_PASSWORD_DEV }}" \
            -auto-approve

  # TEMPORARY (branch-only): apply-prod removed. The GitHub 'prod' environment
  # has no required-reviewer protection, so a successful dev apply would have
  # chained straight into provisioning the ENTIRE prod infrastructure (18
  # resources, premium SKUs). Configure required reviewers on the prod
  # environment before restoring this job.
  apply-prod-disabled:
    if: ${{ false }}
    name: "Apply — prod"
    runs-on: ubuntu-latest
    environment: prod        # requires manual approval in GitHub Environments settings
    needs: apply-dev         # prod only runs after dev succeeds
    defaults:
      run:
        working-directory: infra/envs/prod

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply \
            -lock-timeout=5m \
            -var="pg_admin_password=${{ secrets.PG_ADMIN_PASSWORD_PROD }}" \
            -auto-approve

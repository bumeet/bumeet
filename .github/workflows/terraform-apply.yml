name: "Terraform Apply"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply (dev or prod)"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VERSION:          "1.8.5"
  ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}

jobs:
  apply-dev:
    name: "Apply — dev"
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infra/envs/dev

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply \
            -lock-timeout=5m \
            -var="pg_admin_password=${{ secrets.PG_ADMIN_PASSWORD_DEV }}" \
            -auto-approve

  # apply-prod removed: the prod environment exists only as code (rg-bumeet-prod
  # is not provisioned) and the GitHub 'prod' environment has no
  # required-reviewer protection, so chaining it after apply-dev risked
  # provisioning the entire premium-SKU prod stack by accident. When prod is
  # actually launched: configure required reviewers on the 'prod' environment
  # first, then restore an apply-prod job gated on it.

name: Quality

on:
  pull_request:
    branches: [main]

jobs:
  # ── Detect changed paths ─────────────────────────────────────────────────────
  changes:
    name: "Detect changed paths"
    runs-on: ubuntu-latest
    outputs:
      web:      ${{ steps.filter.outputs.web }}
      api:      ${{ steps.filter.outputs.api }}
      agent:    ${{ steps.filter.outputs.agent }}
      firmware: ${{ steps.filter.outputs.firmware }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - 'platform/apps/web/**'
              - 'platform/package.json'
              - 'platform/pnpm-lock.yaml'
            api:
              - 'platform/apps/api/**'
              - 'platform/package.json'
              - 'platform/pnpm-lock.yaml'
            agent:
              - 'src/bumeet_agent/**'
              - 'pyproject.toml'
              - 'tests/unit/**'
            firmware:
              - 'firmware/**'
            terraform:
              - 'infra/**'

  # ── Web (Next.js) ────────────────────────────────────────────────────────────
  web:
    name: "Web — lint / tsc / test"
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web lint

      - name: Type-check
        run: pnpm --filter web exec tsc --noEmit

      - name: Test
        run: pnpm --filter web test

  # ── API (NestJS) ─────────────────────────────────────────────────────────────
  api:
    name: "API — lint / tsc / test"
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Lint
        run: pnpm --filter api lint

      - name: Type-check
        run: pnpm --filter api exec tsc --noEmit

      - name: Test
        run: pnpm --filter api test

  # ── Python agent ──────────────────────────────────────────────────────────────
  agent:
    name: "Agent — ruff / mypy / pytest"
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy src/bumeet_agent

      - name: Unit tests (pytest)
        run: pytest tests/unit -v

  # ── Firmware (Arduino) ───────────────────────────────────────────────────────
  firmware:
    name: "Firmware — compile"
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install arduino-cli
        # install.sh defaults to $PWD/bin — pin BINDIR so the binary lands where
        # the PATH entry below actually points.
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/bin" sh
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Add M5Stack board index
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json

      - name: Install M5Stack core
        run: |
          arduino-cli core update-index
          arduino-cli core install m5stack:esp32

      - name: Install libraries
        run: |
          arduino-cli lib install "M5Unified"
          arduino-cli lib install "NimBLE-Arduino"

      - name: Compile CoreInk
        run: |
          arduino-cli compile \
            --fqbn m5stack:esp32:m5stack_coreink:PartitionScheme=huge_app \
            firmware/coreink/coreink.ino

      - name: Compile Core2
        run: |
          arduino-cli compile \
            --fqbn m5stack:esp32:m5stack_core2:PartitionScheme=huge_app \
            firmware/core2/core2.ino

  # ── Terraform ────────────────────────────────────────────────────────────────
  terraform:
    name: "Terraform — fmt / validate / tflint"
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.8.5"

      - name: Format check
        run: terraform fmt -check -recursive infra/

      - name: Validate dev
        working-directory: infra/envs/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate prod
        working-directory: infra/envs/prod
        run: |
          terraform init -backend=false
          terraform validate

      - name: Install tflint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: tflint
        run: tflint --recursive --chdir=infra/

  # ── Required merge gate ───────────────────────────────────────────────────
  quality:
    name: quality
    needs: [changes, web, api, agent, firmware, terraform]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed or skipped
        run: |
          python3 - <<'EOF'
          import json, sys
          needs = json.loads("""${{ toJSON(needs) }}""")
          failed = [k for k, v in needs.items() if v["result"] not in ("success", "skipped")]
          if failed:
              print("Failed jobs:", failed)
              sys.exit(1)
          print("All jobs passed or were skipped")
          EOF

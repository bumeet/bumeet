name: "Agent — Build & Release"

# Triggered by pushing a version tag: git tag v1.0.0 && git push --tags
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.0.0)"
        required: true

jobs:
  build:
    name: "Build · ${{ matrix.os }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
            artifact: bumeet-agent-macos
            asset: bumeet-agent-macos
          - os: windows
            runner: windows-latest
            artifact: bumeet-agent-windows.exe
            asset: bumeet-agent-windows.exe
          - os: linux
            runner: ubuntu-latest
            artifact: bumeet-agent-linux
            asset: bumeet-agent-linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install agent + PyInstaller
        run: pip install pyinstaller -e .

      # ── macOS ──────────────────────────────────────────────────────────────
      - name: Build (macOS)
        if: matrix.os == 'macos'
        run: |
          pyinstaller bumeet-agent.spec
          mv dist/bumeet-agent dist/bumeet-agent-macos

      - name: Sign binary (macOS)
        if: matrix.os == 'macos' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          # Import certificate into a temporary keychain
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p bumeet-ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p bumeet-ci build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k bumeet-ci build.keychain
          rm certificate.p12

          # Sign the binary with hardened runtime (required for notarization)
          codesign --sign "Developer ID Application" \
            --options runtime \
            --entitlements packaging/macos/entitlements.plist \
            --force \
            --timestamp \
            dist/bumeet-agent-macos

      - name: Build DMG (macOS)
        if: matrix.os == 'macos'
        run: |
          bash packaging/macos/build-dmg.sh dist/bumeet-agent-macos "${{ inputs.tag || github.ref_name }}"

      - name: Sign PKG and notarize (macOS)
        if: matrix.os == 'macos' && env.MACOS_CERTIFICATE != '' && env.NOTARIZATION_APPLE_ID != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PWD: ${{ secrets.NOTARIZATION_PWD }}
        run: |
          # Sign PKG with Developer ID Installer certificate
          productsign --sign "Developer ID Installer" \
            --timestamp \
            bumeet-agent.dmg bumeet-agent-signed.dmg
          mv bumeet-agent-signed.dmg bumeet-agent.dmg

          # Submit for notarization and wait
          xcrun notarytool submit bumeet-agent.dmg \
            --apple-id "$NOTARIZATION_APPLE_ID" \
            --team-id "$MACOS_TEAM_ID" \
            --password "$NOTARIZATION_PWD" \
            --wait

          # Staple the notarization ticket into the DMG
          xcrun stapler staple bumeet-agent.dmg

      - name: Collect macOS artifacts
        if: matrix.os == 'macos'
        run: |
          mkdir -p dist/release-macos
          cp dist/bumeet-agent-macos dist/release-macos/bumeet-agent-macos
          mv bumeet-agent.dmg dist/release-macos/bumeet-agent.dmg

      - name: Upload macOS artifacts
        if: matrix.os == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: bumeet-agent-macos
          path: dist/release-macos/

      # ── Windows ────────────────────────────────────────────────────────────
      - name: Build (Windows)
        if: matrix.os == 'windows'
        run: |
          pyinstaller bumeet-agent.spec
          mv dist/bumeet-agent.exe dist/bumeet-agent-windows.exe
        shell: bash

      - name: Upload Windows artifact
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: bumeet-agent-windows
          path: dist/bumeet-agent-windows.exe

      # ── Linux ──────────────────────────────────────────────────────────────
      - name: Build (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get install -y libbluetooth-dev libdbus-1-dev
          pyinstaller bumeet-agent.spec
          mv dist/bumeet-agent dist/bumeet-agent-linux

      - name: Upload Linux artifact
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bumeet-agent-linux
          path: dist/bumeet-agent-linux

  release:
    name: "Publish GitHub Release"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "BUMEET Agent ${{ inputs.tag || github.ref_name }}"
          body: |
            ## BUMEET Agent ${{ inputs.tag || github.ref_name }}

            ### Download

            | Platform | Archivo | Notas |
            |---|---|---|
            | macOS | `bumeet-agent.dmg` | Instalador DMG — doble clic, Next → Install |
            | Windows | `bumeet-agent-windows.exe` | 64-bit · ejecuta directamente |
            | Linux | `bumeet-agent-linux` | x86_64 · `chmod +x` antes de ejecutar |

            ### Instalación con un comando

            **macOS** (Terminal):
            ```bash
            curl -fsSL https://raw.githubusercontent.com/bumeet/bumeet/main/scripts/install-macos.sh | bash
            ```

            **Windows** (PowerShell):
            ```powershell
            irm https://raw.githubusercontent.com/bumeet/bumeet/main/scripts/install-windows.ps1 | iex
            ```

            Ambos instaladores descargan el binario, configuran el arranque automático al iniciar sesión y sincronizan la configuración BLE desde el portal.

            ### Instalación manual
            1. Descarga el binario de la tabla superior
            2. **macOS/Linux:** `chmod +x bumeet-agent-*`
            3. Abre el portal → **Device** → copia tu token de API y pégalo en `~/.config/bumeet-agent/config.json` (`%LOCALAPPDATA%\bumeet\bumeet-agent\config.json` en Windows)

            Documentación completa en [bumeet.es](https://bumeet.es).

            Repositorio: [github.com/bumeet/bumeet](https://github.com/bumeet/bumeet)
          files: |
            dist/bumeet-agent-macos/bumeet-agent.dmg
            dist/bumeet-agent-macos/bumeet-agent-macos
            dist/bumeet-agent-windows/bumeet-agent-windows.exe
            dist/bumeet-agent-linux/bumeet-agent-linux
          draft: false
          prerelease: false

      - name: Upload binaries to Azure Blob Storage
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_RELEASES_STORAGE_CONNECTION_STRING }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Upload versioned copy  (e.g. /v0.1.1/bumeet-agent-macos)
          az storage blob upload \
            --container-name releases \
            --name "${TAG}/bumeet-agent.dmg" \
            --file dist/bumeet-agent-macos/bumeet-agent.dmg \
            --overwrite

          az storage blob upload \
            --container-name releases \
            --name "${TAG}/bumeet-agent-macos" \
            --file dist/bumeet-agent-macos/bumeet-agent-macos \
            --overwrite

          az storage blob upload \
            --container-name releases \
            --name "${TAG}/bumeet-agent-windows.exe" \
            --file dist/bumeet-agent-windows/bumeet-agent-windows.exe \
            --overwrite

          az storage blob upload \
            --container-name releases \
            --name "${TAG}/bumeet-agent-linux" \
            --file dist/bumeet-agent-linux/bumeet-agent-linux \
            --overwrite

          # Update the stable 'latest' pointer
          az storage blob copy start \
            --destination-container releases \
            --destination-blob "latest/bumeet-agent.dmg" \
            --source-container releases \
            --source-blob "${TAG}/bumeet-agent.dmg"

          az storage blob copy start \
            --destination-container releases \
            --destination-blob "latest/bumeet-agent-macos" \
            --source-container releases \
            --source-blob "${TAG}/bumeet-agent-macos"

          az storage blob copy start \
            --destination-container releases \
            --destination-blob "latest/bumeet-agent-windows.exe" \
            --source-container releases \
            --source-blob "${TAG}/bumeet-agent-windows.exe"

          az storage blob copy start \
            --destination-container releases \
            --destination-blob "latest/bumeet-agent-linux" \
            --source-container releases \
            --source-blob "${TAG}/bumeet-agent-linux"

name: Web — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'platform/apps/web/**'
      - 'platform/package.json'
      - 'platform/pnpm-lock.yaml'
      - '.github/workflows/web-deploy.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

jobs:
  # TEMPORARY (branch-only): diagnose why bumeet.es is unreachable.
  diagnose:
    name: Diagnose bumeet.es
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: DNS + HTTP checks
        run: |
          for host in bumeet.es www.bumeet.es app.bumeet.es api.bumeet.es polite-grass-0623caf03.7.azurestaticapps.net icy-hill-066964603.2.azurestaticapps.net; do
            echo "════ $host"
            echo "-- DNS:"
            dig +short "$host" A "$host" CNAME || true
            echo "-- HTTP:"
            curl -sS -o /tmp/body -D - --max-time 20 "https://$host" 2>&1 | head -12 || true
            echo "-- Body first lines:"
            head -c 400 /tmp/body 2>/dev/null | tr -d '\0'; echo
          done

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: SWA custom domains
        run: |
          echo "── PROD SWA custom domains:"
          az staticwebapp hostname list --name swa-bumeet-prod --resource-group rg-bumeet-prod -o table || true
          echo "── PROD SWA overview:"
          az staticwebapp show --name swa-bumeet-prod --resource-group rg-bumeet-prod --query "{defaultHostname:defaultHostname, sku:sku.name, state:provisioningState}" -o table || true
          echo "── DEV SWA custom domains:"
          az staticwebapp hostname list --name swa-bumeet-dev --resource-group rg-bumeet-dev -o table || true

  build-and-deploy:
    name: Build & Deploy Web
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: platform/apps/web
          output_location: .next
          skip_api_build: true
        env:
          NEXT_PUBLIC_API_URL: https://api.bumeet.es/api/v1
          NEXT_PUBLIC_SITE_MODE: app
          NEXTAUTH_URL: https://app.bumeet.es
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          AUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          AUTH_URL: https://app.bumeet.es
          # Shared server-to-server secret for the API's oauth-login endpoint.
          INTERNAL_AUTH_SECRET: ${{ secrets.INTERNAL_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          AUTH_MICROSOFT_ENTRA_ID_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          AUTH_MICROSOFT_ENTRA_ID_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          AUTH_SLACK_ID: ${{ secrets.SLACK_CLIENT_ID }}
          AUTH_SLACK_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}


  close-pr:
    name: Close PR environment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - name: Close staging environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          action: close

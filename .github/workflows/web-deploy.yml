name: Web — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'platform/apps/web/**'
      - 'platform/package.json'
      - 'platform/pnpm-lock.yaml'
      - '.github/workflows/web-deploy.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      keep:
        description: "TEMP cleanup mode: comma-separated SWA preview environments to keep (PR numbers)"
        required: false
        default: "47"

jobs:
  # TEMPORARY (branch-only): dispatching this workflow on this branch runs the
  # orphaned-preview cleanup instead of a deploy. See swa-preview-cleanup.yml
  # for the permanent standalone version (dispatchable once merged to main).
  swa-cleanup:
    name: Delete orphaned SWA preview environments
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    env:
      RESOURCE_GROUP: rg-bumeet-dev
      SWA_NAME: swa-bumeet-dev
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Delete staging environments not in keep list
        run: |
          KEEP=",${{ github.event.inputs.keep }},"
          echo "── Environments before cleanup ──"
          az staticwebapp environment list \
            --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "[].{name:name, hostname:hostname, status:status}" -o table

          for ENV_NAME in $(az staticwebapp environment list \
              --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" \
              --query "[?name!='default'].name" -o tsv); do
            if [[ "$KEEP" == *",$ENV_NAME,"* ]]; then
              echo "⏭  Keeping '$ENV_NAME' (in keep list)"
              continue
            fi
            echo "🗑  Deleting staging environment '$ENV_NAME'"
            az staticwebapp environment delete \
              --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" \
              --environment-name "$ENV_NAME" --yes
          done

          echo "── Environments after cleanup ──"
          az staticwebapp environment list \
            --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "[].{name:name, hostname:hostname, status:status}" -o table

  build-and-deploy:
    name: Build & Deploy Web
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: platform/apps/web
          output_location: .next
          skip_api_build: true
        env:
          NEXT_PUBLIC_API_URL: https://api.bumeet.es/api/v1
          NEXT_PUBLIC_SITE_MODE: app
          NEXTAUTH_URL: https://app.bumeet.es
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          AUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          AUTH_URL: https://app.bumeet.es
          # Shared server-to-server secret for the API's oauth-login endpoint.
          INTERNAL_AUTH_SECRET: ${{ secrets.INTERNAL_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          AUTH_MICROSOFT_ENTRA_ID_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          AUTH_MICROSOFT_ENTRA_ID_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          AUTH_SLACK_ID: ${{ secrets.SLACK_CLIENT_ID }}
          AUTH_SLACK_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}


  close-pr:
    name: Close PR environment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - name: Close staging environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          action: close

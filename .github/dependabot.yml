version: 2

updates:
  # npm — pnpm workspace (platform/)
  - package-ecosystem: npm
    directory: /platform
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    labels: [dependencies, javascript]

  # pip — Python agent
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, python]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, github-actions]

  # Terraform
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, terraform]
